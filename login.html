<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4 login-card">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Bienvenido</h2>
                <p class="text-muted">Ingresa tus credenciales para acceder</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="alumno@itoaxaca.edu.mx" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
